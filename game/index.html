<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Hunt — Spot the Difference</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <span id="game-title">Lantern Hunt</span>
      <span id="level-name">Night Market</span>
    </div>
    <div class="hud-mid">
      <span id="found-counter" aria-live="polite">Found 0 / 7</span>
      <span id="timer" aria-live="polite">3:00</span>
      <span id="score">Score 0</span>
    </div>
    <div class="hud-right">
      <button id="hint-btn" type="button" title="Hint (H)">Hint (3)</button>
      <button id="pause-btn" type="button" title="Pause (P)">Pause</button>
      <button id="sound-btn" type="button" title="Sound on/off">Sound: on</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="game" width="1280" height="460" aria-label="Spot the difference: two near-identical pictures side by side. Click a difference on either picture."></canvas>
    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="card">
        <h1 id="overlay-title">Lantern Hunt</h1>
        <p id="overlay-text"></p>
        <div id="overlay-levels" class="levels hidden"></div>
        <div class="card-buttons">
          <button id="overlay-primary" type="button">Start</button>
          <button id="overlay-secondary" type="button" class="hidden">How to play</button>
        </div>
        <p id="overlay-foot" class="foot"></p>
      </div>
    </div>
  </main>

  <footer id="help">
    <span>Click a difference on either picture &mdash; it counts on both.</span>
    <span><b>H</b> hint</span>
    <span><b>P</b> pause</span>
    <span><b>Enter</b> start / next</span>
    <span><b>1&ndash;3</b> pick a scene</span>
  </footer>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
